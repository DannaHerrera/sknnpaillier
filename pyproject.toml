[tool.poetry]
name = "sknnpaillier"
version = "0.1.0"
description = "Encrypted KD-tree nearest-neighbor search with Paillier"
readme = "README.md"
package-mode = true
packages = [{ include = "sknnpaillier" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
numpy = ">=2.0,<3.0"
rich = { version = ">=13,<16", optional = true }

[tool.poetry.extras]
rich = ["rich"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
ruff = ">=0.14,<0.15"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["scripts"]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
