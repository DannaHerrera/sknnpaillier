name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    env:
      SECURITY_LEVEL: test
      SKNN_LOG_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: python -m pip install poetry==2.5.1
      - name: Validate lock
        run: poetry check --lock
      - name: Install library and test dependencies
        run: poetry install --only main,dev --no-interaction
      - name: Run tests
        run: poetry run pytest -q
